[package]
name = "consulta-cep"
version = "1.0.0"
description = "Descubra a sigla do estado brasileiro pelo CEP"
authors = ["you"]
edition = "2021"

[lib]
name = "consulta_cep_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
lto = true
opt-level = "s"
strip = true
codegen-units = 1
